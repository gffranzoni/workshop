<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Embalagens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Workshop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/produtos">Produtos</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-0">Embalagens - <span th:text="${produto.descricao}"></span></h1>
            <p class="text-muted mb-0">
                <a th:href="@{/produtos}">Produtos</a> /
                <a th:href="@{/produtos/{id}/editar(id=${produto.id})}" th:text="${produto.descricao}"></a>
            </p>
        </div>
        <a class="btn btn-primary" th:href="@{/produtos/{produtoId}/embalagens/novo(produtoId=${produto.id})}">Nova embalagem</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>Tipo</th>
                    <th>Codigo de Barras</th>
                    <th>Quantidade</th>
                    <th class="text-end">Acoes</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(embalagens)}">
                    <td colspan="4" class="text-center py-3">Nenhuma embalagem cadastrada.</td>
                </tr>
                <tr th:each="embalagem : ${embalagens}">
                    <td th:text="${embalagem.embalagem.descricao}"></td>
                    <td th:text="${embalagem.codigoDeBarras}"></td>
                    <td th:text="${embalagem.quantidade}"></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/produtos/{produtoId}/embalagens/{id}/editar(produtoId=${produto.id}, id=${embalagem.id})}">Editar</a>
                        <form th:action="@{/produtos/{produtoId}/embalagens/{id}/excluir(produtoId=${produto.id}, id=${embalagem.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <a class="btn btn-outline-secondary" th:href="@{/produtos}">Voltar</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
