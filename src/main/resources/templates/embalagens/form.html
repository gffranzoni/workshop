<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Embalagem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Workshop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/produtos">Produtos</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4 mb-3" th:text="${titulo}">Embalagem</h1>

                    <form th:action="${acao}" method="post" th:object="${embalagemForm}">
                        <div class="mb-3">
                            <label for="embalagem" class="form-label">Tipo de Embalagem</label>
                            <select id="embalagem" th:field="*{embalagem}" class="form-select" th:classappend="${#fields.hasErrors('embalagem')} ? ' is-invalid' : ''">
                                <option value="">Selecione...</option>
                                <option th:each="tipo : ${tiposEmbalagem}" th:value="${tipo}" th:text="${tipo.descricao}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('embalagem')}" th:errors="*{embalagem}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="codigoDeBarras" class="form-label">Codigo de Barras</label>
                            <input type="text" id="codigoDeBarras" th:field="*{codigoDeBarras}" class="form-control" th:classappend="${#fields.hasErrors('codigoDeBarras')} ? ' is-invalid' : ''" maxlength="40">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('codigoDeBarras')}" th:errors="*{codigoDeBarras}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="quantidade" class="form-label">Quantidade</label>
                            <input type="number" step="0.01" id="quantidade" th:field="*{quantidade}" class="form-control" th:classappend="${#fields.hasErrors('quantidade')} ? ' is-invalid' : ''">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('quantidade')}" th:errors="*{quantidade}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a class="btn btn-outline-secondary" th:href="@{/produtos/{produtoId}/embalagens(produtoId=${produto.id})}">Voltar</a>
                            <button type="submit" class="btn btn-primary">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
