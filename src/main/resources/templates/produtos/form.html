<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4 mb-3" th:text="${titulo}">Produto</h1>

                    <form th:action="${acao}" method="post" th:object="${produtoForm}">
                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descricao</label>
                            <input type="text" id="descricao" th:field="*{descricao}" class="form-control" maxlength="120">
                            <div class="text-danger small" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="codigoFabricante" class="form-label">Codigo Fabricante</label>
                            <input type="text" id="codigoFabricante" th:field="*{codigoFabricante}" class="form-control" maxlength="60">
                            <div class="text-danger small" th:if="${#fields.hasErrors('codigoFabricante')}" th:errors="*{codigoFabricante}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="preco" class="form-label">Preco</label>
                            <input type="number" step="0.01" min="0" id="preco" th:field="*{preco}" class="form-control">
                            <div class="text-danger small" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a class="btn btn-outline-secondary" th:href="@{/produtos}">Voltar</a>
                            <button type="submit" class="btn btn-primary">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
