<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Produtos</h1>
        <a class="btn btn-primary" th:href="@{/produtos/novo}">Novo produto</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Descricao</th>
                    <th>Codigo Fabricante</th>
                    <th>Preco</th>
                    <th class="text-end">Acoes</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(produtos)}">
                    <td colspan="5" class="text-center py-3">Nenhum produto cadastrado.</td>
                </tr>
                <tr th:each="produto : ${produtos}">
                    <td th:text="${produto.id}"></td>
                    <td th:text="${produto.descricao}"></td>
                    <td th:text="${produto.codigoFabricante}"></td>
                    <td th:text="${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/produtos/{id}/editar(id=${produto.id})}">Editar</a>
                        <form th:action="@{/produtos/{id}/excluir(id=${produto.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
